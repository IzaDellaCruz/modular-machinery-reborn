name: Bug Report
description: File a bug report.
title: "[Bug]: <title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Modular Machinery Reborn are you using?
      options:
        - 3.0.11
        - 3.0.10
        - 3.0.9
        - 3.0.8
        - 3.0.7
        - 3.0.6
        - 3.0.5
        - 3.0.4
        - 3.0.3
        - 3.0.2
        - 3.0.1
        - 3.0.0
        - 2.5.1
        - 2.5.0
        - 2.4.7
        - 2.4.6
        - 2.4.5
        - 2.4.4
        - 2.4.3
        - 2.4.2
        - 2.4.1
        - 2.4.0
        - 2.3.3
        - 2.3.2
        - 2.3.1
        - 2.3.0
        - 2.2.3
        - 2.2.2
        - 2.2.1
        - 2.2.0
        - 2.1.5
        - 2.1.4
        - 2.1.3
        - 2.1.2
        - 2.1.1
        - 2.1.0
        - 2.0.0
        - 1.1.19
        - 1.1.18
        - 1.1.16
        - 1.1.15
        - 1.1.14
        - 1.1.13
        - 1.1.12
        - 1.1.11
        - 1.1.10
        - 1.1.9
        - 1.1.8
        - 1.1.7
        - 1.1.6
        - 1.1.5
        - 1.1.4
        - 1.1.3
        - 1.1.2
        - 1.1.1
        - 1.1.0
        - 1.0.2
        - 1.0.1
        - 1.0.0
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happen
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        1. With this config...
        1. Run '...'
        1. See error...
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
        
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
